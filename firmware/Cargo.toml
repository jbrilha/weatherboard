cargo-features = ["per-package-target"]

[package]
edition = "2024"
name = "firmware"
version = "0.1.0"
authors = ["jbrilha <joao.brilha2001@gmail.com>"]
forced-target = "thumbv8m.main-none-eabihf"

[[bin]]
name = "firmware"
test = false
bench = false

[dependencies]
common = { path = "../common", features = ["defmt"] }
ui = { path = "../ui" }
defmt = "1.1"
defmt-rtt = "1.2"
panic-probe = { version = "1.0", features = ["print-defmt"] }

embassy-embedded-hal = "0.6"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-io = "0.7"
embedded-io-async = "0.7"
embedded-storage = "0.3.1"
cortex-m-rt = "0.7.5"

embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt", "executor-interrupt"] }
embassy-sync = { version = "0.8" }
embassy-futures = "0.1"
embassy-time = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }

cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
embassy-stm32 = { version = "0.6", features = ["defmt", "stm32wba65ci", "unstable-pac", "memory-x", "time-driver-any", "exti", "embassy-crypto-aes128-ecb", "embassy-crypto-aes128-ccm", "embassy-crypto-p256-arith", "embassy-crypto-aes128-cmac", "embassy-crypto-rng" ] }
micromath = "2.1.0"
static_cell = "2.1.1"

# https://github.com/jorgeandrecastro/embassy-ssd1306
embassy-ssd1306 = "0.6.0"
embedded-graphics = "0.8.2"
embedded-hal-bus = { version = "0.3.0", features = ["async"] }

aligned = "0.4.2"
heapless = { version = "0.9.2", default-features = true }
embedded-fatfs = { git = "https://github.com/MabezDev/embedded-fatfs", default-features = false, features = ["defmt", "lfn"] }
block-device-driver = { git = "https://github.com/MabezDev/embedded-fatfs" }
block-device-adapters = { git = "https://github.com/MabezDev/embedded-fatfs" }
mousefood = "0.5.2"

mpu6500 = { git = "https://github.com/jbrilha/mpu6500_rs", features = ["defmt"] }

display-interface = "0.5.0"
display-interface-spi = "0.5.0"
weact-studio-epd = { git = "https://github.com/jbrilha/weact-studio-epd" }
embassy-stm32-wpan = { version = "0.1.0", features = ["defmt", "stm32wba65ci", "bt-hci", "wb-hci", "wba-ble", "ble-stack-basic", "linklayer6-ble-basic"] }
stm32wb-hci = { git = "https://github.com/oueslatighaith/stm32wb-hci", branch = "master" }

[patch.crates-io]
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy", rev = "a7ef4b7459e1452709293b4ec6b5c5acef5cf414" }
embassy-stm32-wpan = { git = "https://github.com/embassy-rs/embassy", rev = "a7ef4b7459e1452709293b4ec6b5c5acef5cf414" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "a7ef4b7459e1452709293b4ec6b5c5acef5cf414" }
embassy-sync = { git = "https://github.com/embassy-rs/embassy", rev = "a7ef4b7459e1452709293b4ec6b5c5acef5cf414" }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "a7ef4b7459e1452709293b4ec6b5c5acef5cf414" }
embassy-embedded-hal = { git = "https://github.com/embassy-rs/embassy", rev = "a7ef4b7459e1452709293b4ec6b5c5acef5cf414" }
embassy-futures = { git = "https://github.com/embassy-rs/embassy", rev = "a7ef4b7459e1452709293b4ec6b5c5acef5cf414" }

[profile.release]
debug = 2
lto = true
opt-level = 'z'

[profile.dev]
debug = 2
opt-level = "z"

[profile.dev.package."*"]
opt-level = "z"

