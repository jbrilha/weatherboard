<section
  id="weather"
  hx-get="/fragments/weather"
  hx-trigger="every 60s"
  hx-swap="outerHTML"
>
  <p>Origin: {{ ip.origin }}</p>
  <p>Lat: {{ weather_info.lat }}</p>
  <p>Lon: {{ weather_info.lon }}</p>
  <p>Timezone: {{ weather_info.timezone }}</p>
  <p>TZ Offset: {{ weather_info.timezone_offset }}</p>
</section>
