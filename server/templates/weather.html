<section
  id="weather"
  hx-get="/fragments/weather"
  hx-trigger="every 60s"
  hx-swap="outerHTML"
>
  <p>Origin: {{ ip.origin }}</p>
  <p>Lat: {{ forecast.lat }}</p>
  <p>Lon: {{ forecast.lon }}</p>
  <p>Timezone: {{ forecast.timezone }}</p>
  <p>TZ Offset: {{ forecast.timezone_offset }}</p>
</section>
