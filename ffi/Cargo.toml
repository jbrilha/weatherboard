[package]
name = "weatherboard_ffi"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
common = { path = "../common" }

[build-dependencies]
cbindgen = { version = "0.29", default-features = false }
common = { path = "../common" }

[profile.release]
panic = "abort"
lto = true
opt-level = "z"

[profile.dev]
panic = "abort"
