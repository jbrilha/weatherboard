[workspace]
resolver = "3"
members = [
    "server",
    "common",
    "hub",
    "ui",
    "sim",
]
exclude = ["firmware"]

[workspace.dependencies]
common = { path = "common" }
ui = { path = "ui" }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29", default-features = false, features = ["v5"] }
postcard = { version = "1.1", default-features = false }
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3.34"
anyhow = "1.0.104"
reqwest = { version = "0.13.5", features = ["json", "query"] }
jiff = { version = "0.2.38", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
strum = { version = "0.28.0",  default-features = false, features = ["derive"] }
enum-iterator = "2.3.0"

[profile.release]
debug = 2
lto = true
opt-level = 'z'

[profile.dev]
debug = 2

[profile.dev.package."*"]
opt-level = "z"
