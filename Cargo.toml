[workspace]
resolver = "3"
members = [
    "server",
    "firmware",
    "common",
    "hub",
]

[workspace.dependencies]
common = { path = "common" }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
anyhow = "1.0.104"
reqwest = "0.13.5"
jiff = { version = "0.2.23", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
debug = 2
lto = true
opt-level = 'z'

[profile.dev]
debug = 2

[profile.dev.package.firmware]
opt-level = "z"

[profile.dev.package."*"]
opt-level = "z"
